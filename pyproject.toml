[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-handoff"
version = "0.1.0"
description = "Local-first, verified work-state capsules for continuing AI tasks"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Portable Handoff contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "build>=1.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
portable-handoff = "portable_handoff.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portable_handoff = ["py.typed", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
# Correctness and modernization rules. Line length is left to the formatter so
# that a long, deliberate one-line dictionary literal is not a lint failure.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# The quality evaluator adjusts sys.path before importing the package so it can
# run as a standalone script as well as under pytest.
"tests/quality/evaluate_quality.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
